<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scr/css/reset.css">
    <link rel="stylesheet" href="scr/css/menu.css">
    <link rel="stylesheet" href="scr/css/contato.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <title>Agendamento</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 8px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body id="body">
    <header class="cabecalhoPrincipal">
        <a name="Top"></a>
        <div class="container">
            <a href="index.html">
                <img src="scr/assents/ONG/logo (1).png" alt="" class="image-logo">
            </a>
            <div class="header">
                <div class="check-box-container">
                    <div class="check-box-wrapper">
                        <input type="checkbox" id="toggle">
                        <label class="checkbox" for="toggle">
                            <div class="trace"></div>
                            <div class="trace"></div>
                            <div class="trace"></div>
                        </label>
                        <div class="menu"></div>
                        <nav class="menu-items">
                            <ul>
                                <li><a href="index.html">Home</a></li>
                                <li><a href="galeria.html">Galeria</a></li>
                                <li><a href="endereco.html">Endereço</a></li>
                                <li><a href="quemsomos.html">Quem Somos</a></li>
                                <li><a href="doador.html">Doador</a></li>
                                <li><a href="contato.html">Contato</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <section class="content">
        <div class="contato">
            <h3>Formulário de agendamento de visitas externas.</h3>
            <form class="form" onsubmit="return handleSubmit(event)">
                <input type="text" class="field" name="nome" placeholder="Nome">
                <input type="text" class="field" name="email" placeholder="Email">
                <input type="datetime-local" class="field" name="datetime-local">
                <textarea name="message" cols="30" rows="10" class="field" placeholder="Digite sua mensagem aqui..."></textarea>
                <input type="submit" value="Enviar" class="field">
                <a href="https://api.whatsapp.com/send/?phone=5511995259291&text=Obrigado por entrar em contato com a ABRACC, o que posso te ajudar?&app_absent=0">
                    <input type="button" value="Nos envie uma mensagem no whatsapp" class="field2">
                </a>
            </form>
        </div>
    </section>
    <footer>
        <div class="rodape-principal">
            <a href="index.html">
                <img src="scr/assents/ONG/logo (1).png" alt="" class="image-logo">
            </a>
            <legend class="copyright">&copy; Copyright ABRACC - 2021</legend>
            <a href="#Top" class="top">Voltar</a>
        </div>
    </footer>
    
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h4>Campos obrigatórios</h4>
            <br>
            <p id="modalMessage"></p>
        </div>
    </div>

    <script src="scr/JS/menu-aberto.js"></script>

    <script>
        AOS.init({
            once: true,
            duration: 1500
        });

        function handleSubmit(event) {
            event.preventDefault();

            let nome = document.querySelector('input[name="nome"]').value;
            let email = document.querySelector('input[name="email"]').value;
            let message = document.querySelector('textarea[name="message"]').value;
            let datahora = document.querySelector('input[name="datetime-local"]').value; 

            let errors = []; 
            if (!nome) {
                errors.push('Por favor, preencha seu nome.');
            } else if (nome.length < 3) { // Removido tipo
                errors.push('Por favor, insira um nome válido.');
            }
            if (!email) {
                errors.push('Por favor, preencha seu email.');
            } else if (!validateEmail(email)) {
                errors.push('Por favor, insira um email válido.');
            }
            if (!datahora) {
                errors.push('Por favor, insira a data e hora.');
            }
            if (!message) {
                errors.push('Por favor, digite sua mensagem.');
            }
            
            if (errors.length > 0) {
                showModal(errors.join('<br>')); 
                return false;
            }
            document.querySelector('input[name="nome"]').value = "";
            document.querySelector('input[name="email"]').value = "";
            document.querySelector('textarea[name="message"]').value = "";
            document.querySelector('input[name="datetime-local"]').value = ""; 

            alert('Formulário enviado com sucesso!');
            return true;
        }

        function showModal(message) {
            document.getElementById('modalMessage').innerHTML = message; 
            document.getElementById('errorModal').style.display = "flex";
        }

        function closeModal() {
            document.getElementById('errorModal').style.display = "none";
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(String(email).toLowerCase());
        }
    </script>
</body>

</html>
